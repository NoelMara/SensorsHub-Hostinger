name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build assets
        run: npm ci && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload built assets
        run: |
          rsync -az --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            public/build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/domains/sensorshub.tech/LaravelProject/SensorsHub/public/build/

      - name: Pull code and refresh Laravel
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "cd ~/domains/sensorshub.tech/LaravelProject/SensorsHub && \
           git pull origin main && \
           composer install --no-dev --optimize-autoloader --no-scripts && \
           php artisan migrate --force && \
           php artisan config:cache && php artisan route:cache && php artisan view:cache"